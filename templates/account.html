{% extends 'base.html' %}

{% block title %}
Account
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
        <div class="card p-4" style="width: 100%; max-width: 400px; background-color: #DEF2F1; border: 2px solid #2B7A78;">
            <h3 class="text-center" id="formTitle">Login</h3>
            <form id="authForm" method="POST" action="{{ url_for('account') }}">
                <input type="hidden" name="action" id="action" value="login">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2" style="background-color: #2B7A78;">Submit</button>
                <p class="text-center">
                    <a href="#" id="toggleForm" class="text-decoration-none" style="color: #2B7A78;">Don't have an account? Sign up</a>
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const toggleForm = document.getElementById("toggleForm");
    const formTitle = document.getElementById("formTitle");
    const actionInput = document.getElementById("action");

    toggleForm.addEventListener("click", (event) => {
        event.preventDefault();
        if (actionInput.value === "login") {
            formTitle.innerText = "Sign Up";
            toggleForm.innerText = "Already have an account? Login";
            actionInput.value = "signup";
        } else {
            formTitle.innerText = "Login";
            toggleForm.innerText = "Don't have an account? Sign up";
            actionInput.value = "login";
        }
    });
</script>
{% endblock %}
