<!doctype html>
<html>
    <!-- Admin -->
    <head>
        <!-- Importing libraries -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Improves loading times -->
        <link rel="preconnect" href="https://cdn.jsdelivr.net">
        <link rel="preconnect" href="https://unpkg.com">
        
        <!-- Base CSS -->
        <link rel="stylesheet" href="/static/css/base.css">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

        <!-- AOS -->
        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

        <!-- Background -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script> 
        <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">

        <!-- Base code for title -->
        <title>
            {% block title %}
            {% endblock %}
        </title>
    </head>

    <!-- Main HTML -->
    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-md navbar-dark fixed-top" style="background-color: #2B7A78; z-index: 1040; top: 0;">
            <div class="container-fluid">
                <!-- WFS Logo for Navbar -->
                <a class="navbar-brand" href="{{ url_for('modelPage') }}">
                    <img src="/static/images/DorsetSoftwareLogo.png" height="30" alt="Dorset Software Logo">
                </a>
            
                <!-- For responsiveness -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" style="color: #ffffff;"></span>
                </button>
            
                <!-- Actual links -->
                <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav">
                        <!-- Your models -->
                        <li class="nav-item mx-3 mx-md-3 mx-lg-4">
                          <a class="btn active nav-link text-white hvr-underline-from-center hvr-glow hvr-grow hvr-bob" href="{{ url_for('modelPage') }}">Your Models</a>
                        </li>

                        <!-- Help section -->
                        <li class="nav-item mx-3 mx-md-3 mx-lg-4">
                          <a class="btn active nav-link text-white hvr-underline-from-center hvr-glow hvr-grow hvr-bob" href="{{ url_for('helpPage') }}">Help Section</a>
                        </li>
                        
                        <!-- Logout -->
                        <li class="nav-item mx-3 mx-md-3 mx-lg-4">
                          <a class="btn active nav-link text-white hvr-underline-from-center hvr-glow hvr-grow hvr-bob" href="#">Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Base code that's included in other HTML pages -->
        {% block content %}
        {% endblock %}

        <!-- JS code -->
        {% block scripts %}
        {% endblock %}

        <!-- Footer -->
        <div class="container-fluid fixed-bottom" style="background-color: #2B7A78; color: #ffffff; padding: 10px;">
            <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 border-top">
                <!-- Logo -->
                <div class="col-md-4 d-flex align-items-center justify-content-start">
                    <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
                        <img src="/static/images/DorsetSoftwareLogo.png" height="30" alt="Dorset Software Logo">
                    </a>
                </div>
            </footer>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
        
        <!-- JS components -->
        <script src="/static/javascript/base.js"></script>
    </body>
</html>
